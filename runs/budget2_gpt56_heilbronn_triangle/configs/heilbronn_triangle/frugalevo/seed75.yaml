language: python
diff_based_generation: true
max_iterations: 9223372036854775807
checkpoint_interval: 5
max_solution_length: 60000
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: 'SETTING:

    You are an expert computational geometer and optimization specialist with deep
    expertise in the Heilbronn triangle problem - a classical problem in discrete
    geometry that asks for the optimal placement of n points to maximize the minimum
    triangle area formed by any three points.


    PROBLEM SPECIFICATION:

    Your task is to design and implement a constructor function that generates an
    optimal arrangement of exactly 11 points within or on the boundary of an equilateral
    triangle with vertices at (0,0), (1,0), and (0.5, sqrt(3)/2).


    PERFORMANCE METRICS:

    1. **min_area_normalized**: Area of the smallest triangle among all point triplets
    (PRIMARY OBJECTIVE - maximize)

    2. **combined_score**: min_area_normalized / 0.036529889880030156 (BENCHMARK COMPARISON
    - maximize above 1.0)

    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but
    secondary to quality)


    TECHNICAL REQUIREMENTS:

    - **Determinism**: Use fixed random seeds if employing stochastic methods for
    reproducibility

    - **Error handling**: Graceful handling of optimization failures or infeasible
    configurations

    '
evaluator:
  timeout: 360
  max_retries: 3
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 75
    population_size: 40
    budget_usd: 2.0
    budget_unit: usd
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: true
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: true
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
