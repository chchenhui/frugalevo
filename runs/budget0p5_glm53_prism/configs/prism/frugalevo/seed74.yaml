language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  max_tokens: 16384
  timeout: 300
  reasoning_effort: low
  retries: 0
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: 'You are an expert for model placement on GPUs. Your task is to
    improve a model placement algorithm by improve the function named compute_model_placement
    in the intial program that places models to available GPUs.

    The algorithm must MINIMIZE the maximum KVPR across all GPUs while ensuring models
    can fit into the GPUs'' memory. Note that KVPR is KV cache pressure for a GPU.
    It indicates how crowded a GPU is. For a specific GPU, its KVPR is computed as
    sum(model.req_rate/model.slo for model in models) / (GPU_MEM_SIZE - sum(model.model_size
    for model in models)), where models are the models on this GPU. The generated
    program should be as simple as possible and the code should be executed correctly
    without errors.'
evaluator:
  timeout: 360
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 74
    population_size: 40
    budget_usd: 0.5
    budget_unit: usd
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: false
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: false
    search_incumbent_enabled: false
    search_incumbent_stagnation_patience: 2
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    improvement_epsilon: 1.0e-07
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
