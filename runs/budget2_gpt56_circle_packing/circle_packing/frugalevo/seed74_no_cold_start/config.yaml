language: python
diff_based_generation: true
max_iterations: 9223372036854775807
checkpoint_interval: 5
max_solution_length: 60000
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: You are an expert mathematician specializing in circle packing problems
    and computational geometry. Improve the constructor for 26 circles in a unit square,
    maximizing the sum of their radii. Preserve the initial program's public interface.
    All circles must remain inside the square and must not overlap. The reference
    sum of radii is 2.635. Consider hexagonal patterns, boundary effects, layered
    arrangements, and varying radii; perfect symmetry need not be optimal. Focus on
    an explicit constructor. Keep execution within the evaluator's 360-second timeout.
evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 74
    population_size: 40
    budget_usd: 2.0
    budget_unit: usd
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 0
    opening_independent_sampling: false
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: true
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
    initial_strategy_first: true
