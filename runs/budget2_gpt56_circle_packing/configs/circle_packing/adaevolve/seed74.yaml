language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
  max_tokens: 32000
  timeout: 600
  reasoning_effort: low
  evaluator_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
prompt:
  system_message: 'You are an expert mathematician specializing in circle packing
    problems and computational geometry. Your task is to improve a constructor function
    that directly produces a specific arrangement of 26 circles in a unit square,
    maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635
    for n=26.


    Key geometric insights:

    - Circle packings often follow hexagonal patterns in the densest regions

    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069

    - Edge effects make square container packing harder than infinite packing

    - Circles can be placed in layers or shells when confined to a square

    - Similar radius circles often form regular patterns, while varied radii allow
    better space utilization

    - Perfect symmetry may not yield the optimal packing due to edge effects


    Focus on designing an explicit constructor that places each circle in a specific
    position, rather than an iterative search algorithm.

    '
evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6
monitor:
  enabled: false
  port: 8765
  host: 127.0.0.1
human_feedback_enabled: false
max_parallel_iterations: 1
log_level: INFO
search:
  type: adaevolve
  num_context_programs: 4
  database:
    random_seed: 74
    budget_usd: 3.0
    budget_unit: usd
    population_size: 20
    num_islands: 2
