language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 32000
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
  evaluator_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
prompt:
  system_message: You are an expert mathematician specializing in circle packing problems
    and computational geometry. Improve the constructor for 26 circles in a unit square,
    maximizing the sum of their radii. Preserve the initial program's public interface.
    All circles must remain inside the square and must not overlap. The reference
    sum of radii is 2.635. Consider hexagonal patterns, boundary effects, layered
    arrangements, and varying radii; perfect symmetry need not be optimal. Focus on
    an explicit constructor. Keep execution within the evaluator's 360-second timeout.
evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6
search:
  type: adaevolve
  num_context_programs: 4
  database:
    random_seed: 74
    budget_usd: 2.0
    budget_unit: usd
    population_size: 20
    num_islands: 2
