max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  reasoning_effort: low
  max_tokens: 16384
  timeout: 300
  retries: 0
  models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: "You are an expert in database transaction optimization.\nOnly change\
    \ code within EVOLVE-BLOCK-START and EVOLVE-BLOCK-END.\nYour task is to improve\
    \ a scheduling function to find better schedules for transactional workloads made\
    \ up of read and write operations to data items. There are conflicts between these\
    \ transactions on items and reducing the delay of these conflicts will lead to\
    \ schedules with lower makespan. Focus on improving the get_best_schedule function\
    \ to find a schedule with as low makespan as possible.\n\n**TASK:** Improve the\
    \ `get_best_schedule` function to find optimal transaction schedules that minimize\
    \ makespan for database workloads with read/write conflicts.\n\n**PROBLEM SPECIFICS:**\n\
    - **Input:** JSON workload with transactions like `\"txn0\":\"w-17 r-5 w-3 r-4\
    \ r-54 r-14 w-6 r-11 w-22 r-7 w-1 w-8 w-9 w-27 r-2 r-25\"`\n- **Operations:**\
    \ Each transaction is a sequence of read (`r-{key}`) and write (`w-{key}`) operations\
    \ on data items\n- **Conflicts:** Read-write and write-write conflicts on the\
    \ same key create dependencies between transactions\n- **Goal:** Find transaction\
    \ ordering that minimizes total makespan\n\n **SEARCH SUGGESTIONS:**\n- **Greedy:**\
    \ You can try a greedy algorithm to iteratively pick the transaction that increases\
    \ makespan the least.\n- Avoid only using heuristics like transaction length,\
    \ number of writes, etc. because these do not correspond to the actual makespan\
    \ of the schedule.\n\nFocus on evolving the `get_best_schedule` function to produce\
    \ the best schedule possible with the lowest makespan.\n\nExplain step-by-step\
    \ the reasoning process for your solution and how this will lead to a better schedule."
evaluator:
  timeout: 360
  cascade_evaluation: false
  cascade_thresholds:
  - 0.5
  - 0.75
  max_concurrent: 1
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 75
    budget_usd: 0.5
    budget_unit: usd
    population_size: 40
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: false
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: true
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: false
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
    strategy_prompt_addendum: 'Task contract: modify only the EVOLVE block and preserve
      get_best_schedule(workload, num_seqs). Each returned schedule must be a complete
      permutation of all transaction IDs for that workload. The unchanged caller recomputes
      each schedule with workload.get_opt_seq_cost; minimize the sum of the three
      true makespans. combined_score = 1000000 / (1 + total_makespan). Fabricated
      costs, empty schedules, skipped workloads, and changes to the simulator or caller
      are forbidden. The entire three-workload evaluation has a hard 360-second limit,
      including startup. Produce a complete feasible schedule first, reserve time
      for the remaining workloads and return the best found before the deadline. Identify
      the bottleneck using observed code changes and scores. Keep plans concise: observed
      bottleneck, replacement, compute budget, and testable gain hypothesis. At least
      one portfolio strategy must reconsider the complete construction mechanism,
      not only its final local refinement. Reuse successful algorithm components from
      context when useful. Do not assume the current constructor is optimal or require
      a predicted numeric gain before testing a new heuristic.'
    implementation_prompt_addendum: 'Task contract: modify only the EVOLVE block and
      preserve get_best_schedule(workload, num_seqs). Each returned schedule must
      be a complete permutation of all transaction IDs for that workload. The unchanged
      caller recomputes each schedule with workload.get_opt_seq_cost; minimize the
      sum of the three true makespans. combined_score = 1000000 / (1 + total_makespan).
      Fabricated costs, empty schedules, skipped workloads, and changes to the simulator
      or caller are forbidden. The entire three-workload evaluation has a hard 360-second
      limit, including startup. Produce a complete feasible schedule first, reserve
      time for the remaining workloads and return the best found before the deadline.
      Implement the requested mechanism using the simulator true cost. Cache repeated
      evaluations where useful. Use a shared total time budget or conservative per-workload
      deadlines rather than granting each workload 360 seconds. If a promoted reference
      changed the code structure, adapt the strategy to the actual parent.'
    guidance_profile: txn_scheduling
