language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
llm:
  api_base: https://openrouter.ai/api/v1
  reasoning_effort: low
  max_tokens: 16384
  timeout: 300
  retries: 0
  models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: 'You are an expert computational geometer and numerical optimization
    researcher.

    Improve heilbronn_convex13(), which must deterministically return a finite NumPy

    array of shape (13, 2). Maximize the minimum area among all C(13,3)=286 triangles,

    normalized by the convex-hull area. The evaluator''s combined_score divides this

    normalized minimum area by the reference value 0.030936889034895654, so values

    above 1.0 improve on the reference.


    Preserve the public function name and return shape. Coordinate scale, translation,

    rotation, and general affine normalization do not change the normalized objective.

    Avoid duplicate or nearly collinear triples and degenerate convex hulls. Consider

    boundary/interior topology, symmetry-breaking configurations, max-min optimization,

    smooth minimum surrogates, active-set refinement, multistart local optimization,

    and deterministic perturbation schedules. Always retain and return the best valid

    incumbent when a numerical optimizer fails. Keep evaluation comfortably within

    the timeout and do not hard-code evaluator outputs.

    '
evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 75
    population_size: 40
    budget_usd: 1.0
    budget_unit: usd
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: false
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 5
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: false
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
