language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  reasoning_effort: low
  max_tokens: 16384
  timeout: 300
  retries: 0
  models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: 'SETTING:

    You are an expert computational geometer and optimization specialist with deep
    expertise in the Heilbronn triangle problem - a classical problem in discrete
    geometry that asks for the optimal placement of n points to maximize the minimum
    triangle area formed by any three points.


    PROBLEM SPECIFICATION:

    Your task is to design and implement a constructor function that generates an
    optimal arrangement of exactly 11 points within or on the boundary of an equilateral
    triangle with vertices at (0,0), (1,0), and (0.5, sqrt(3)/2).


    PERFORMANCE METRICS:

    1. **min_area_normalized**: Area of the smallest triangle among all point triplets
    (PRIMARY OBJECTIVE - maximize)

    2. **combined_score**: min_area_normalized / 0.036529889880030156 (BENCHMARK COMPARISON
    - maximize above 1.0)

    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but
    secondary to quality)


    TECHNICAL REQUIREMENTS:

    - **Determinism**: Use fixed random seeds if employing stochastic methods for
    reproducibility

    - **Error handling**: Graceful handling of optimization failures or infeasible
    configurations

    '
evaluator:
  timeout: 360
  max_retries: 3
search:
  type: openevolve_native
  num_context_programs: 4
  database:
    random_seed: 74
    budget_usd: 1.0
    budget_unit: usd
    population_size: 40
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
