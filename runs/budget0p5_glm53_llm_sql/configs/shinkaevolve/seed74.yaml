language: python
diff_based_generation: false
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  reasoning_effort: low
  max_tokens: 16384
  timeout: 300
  retries: 0
  models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: "Optimize the existing Evolved class for LLM prompt prefix caching\
    \ while preserving the input data.\n\nActual evaluator objective:\n- Each output\
    \ row is serialized as \"\".join(row.fillna(\"\").astype(str).values).\n  Fields\
    \ have no separators. Missing values become empty strings for scoring.\n- The\
    \ evaluator queries a shared character Trie for the longest matching prefix\n\
    \  of that serialized row, then inserts the row. Reuse can come from any row\n\
    \  already inserted, not only the adjacent row. A match may end inside a field\n\
    \  or cross field boundaries. The reward is matched character length, not\n  squared\
    \ field length or a count of exactly matching cells.\n- A dataset's hit rate is\
    \ total matched characters / total serialized characters.\n  Combined score =\
    \ 0.95 * average_hit_rate\n  + 0.05 * (12 - min(12, average_runtime)) / 12.\n\
    \  Averages are across successfully evaluated datasets; all datasets must succeed.\n\
    \  The reported total_runtime is a sum, not the average used by the formula.\n\
    - The evaluator uses exact serial character-Trie reuse, computed as the sum\n\
    \  of adjacent LCP lengths after sorting serialized rows. For a fixed multiset\n\
    \  of row strings the hit count is insertion-order independent. Runtime still\n\
    \  affects the score. Do not modify or access evaluator state.\n- Adjacent-row\
    \ matching and field statistics are optional heuristics, not the\n  definition\
    \ of the objective. Consider sharing across the entire row collection.\n\nRequired\
    \ API and constraints:\n- Preserve the Evolved(Algorithm) class and existing public\
    \ method signatures,\n  including reorder(self, df, early_stop=0, row_stop=None,\
    \ col_stop=None,\n  col_merge=[], one_way_dep=[], distinct_value_threshold=0.8,\
    \ parallel=True).\n- Return (reordered_dataframe, column_orderings), with valid\
    \ per-row column\n  orderings consistent with the returned data. Support row-specific\
    \ orders.\n- Preserve the data and shape: do not add, remove, fabricate or alter\
    \ cells,\n  rows or columns. Preserve row identity and honor the API's supplied\
    \ constraints.\n  The scoring serialization does not authorize changing stored\
    \ cell values.\n- Handle mixed types and missing values, and keep time and memory\
    \ bounded.\n- Improve the algorithm itself; do not exploit evaluator concurrency\
    \ or validation.\n\nFollow the current request's output format for code or strategy\
    \ generation.\n\nDesign guidance for this experiment:\n- In an ideal serial Trie,\
    \ total reuse equals total serialized length minus the number of character edges\
    \ created. For a fixed set of output strings, row order does not change this total.\
    \ Do not optimize only adjacent-row overlap or squared field lengths.\n- A useful\
    \ candidate construction is a conditional prefix partition tree: within each current\
    \ group of rows, select a remaining field using actual character savings, partition\
    \ on its serialized values, then choose suffix orders separately inside each group.\
    \ Bound the work on wide tables; use a deterministic cheap tail. This is a hypothesis\
    \ to evaluate, not a required algorithm.\n- For a fixed collection of serialized\
    \ strings, exact ideal Trie reuse can be computed as the sum of longest-common-prefix\
    \ lengths between lexicographically adjacent sorted strings. Use this as an internal\
    \ deterministic objective only when the cost is bounded; do not reimplement the\
    \ full evaluator for every tiny edit.\n- Preserve every source row and every value.\
    \ Do not pad, duplicate, fabricate, or drop data. Honor required column merges\
    \ using the existing API semantics; scoring normalization must not modify the\
    \ stored values. Use object dtype for mixed-type output.\n- You may replace the\
    \ complete editable algorithm while preserving public interfaces. Produce a complete\
    \ runnable program, not patch fragments. Do not keep unused slow paths merely\
    \ to match the parent length.\n\n\nBounded construction selection to avoid per-instance\
    \ regressions:\n- Rather than trusting a single heuristic, consider at most three\
    \ cheap alternative row-field orderings, measure their actual ideal character-Trie\
    \ reuse with the sorted-string LCP sum, and return the best. This is one bounded\
    \ construction-selection mechanism, not an unbounded search pipeline. Account\
    \ for the total time spent constructing and scoring all alternatives.\n- Include\
    \ a simple reliable global column-order alternative ranked by sum over serialized\
    \ values v of len(v) * count(v) * (count(v)-1), with deterministic tie breaks.\
    \ This is only a heuristic proposal, so use the real LCP score to select it against\
    \ alternatives.\n- A distinct alternative is recursive conditional grouping: select\
    \ a shared leading field inside each group based on length-weighted repetition,\
    \ partition rows by that field value, and choose suffixes separately for each\
    \ group. Avoid recomputing pandas statistics at every node; factorize values once,\
    \ use integer codes, and stop branching when reuse disappears. Bound depth, group\
    \ work, and candidate columns.\n- A third alternative may use a different length/frequency\
    \ tradeoff or a stable predecessor-prefix alignment. Select using all serialized\
    \ characters, including partial-field prefixes; never select using only adjacent\
    \ input rows.\n- Do not recompute the full LCP objective inside a large combinatorial\
    \ loop. Two or three whole-program candidate constructions with one score each\
    \ suffice. Always retain all original cell values and output their per-row permutation.\n\
    \n\nImplementation cost guidance:\n- Avoid Python per-character loops for long-string\
    \ LCP scoring: after handling identical strings directly, binary search the common\
    \ prefix length using prefix-slice equality so comparisons run in C. Benchmark\
    \ this bounded implementation choice locally inside your reasoning, not through\
    \ extra evaluation calls.\n- Reuse serialized cell strings, factorized codes and\
    \ length arrays across constructions. Avoid pandas Series creation, fillna, value_counts\
    \ and astype inside row/group loops. Preserve serialization of missing and mixed-type\
    \ cells exactly; only the scoring representation is normalized.\n- Your construction\
    \ selector should include a global frequency-ranked ordering AND a conditional\
    \ partition using length-weighted pair repetition (count*(count-1)), not only\
    \ immediate (count-1) savings. These are distinct hypotheses; choose using the\
    \ actual serial-Trie character objective, never unverified estimates.\n- On wide\
    \ tables use precomputed integer factorization and vectorized bincount, bound\
    \ candidate columns and do not run full character scoring per tree node. Do not\
    \ hard-code dataset names or dataset-specific score thresholds.\n"
evaluator:
  timeout: 360
  max_concurrent: 1
  cascade_evaluation: false
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: shinkaevolve
  num_context_programs: 4
  database:
    random_seed: 74
    budget_usd: 0.5
    budget_unit: usd
random_seed: 74
