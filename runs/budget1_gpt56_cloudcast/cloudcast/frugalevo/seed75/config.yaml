language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: 'You are an expert in cloud infrastructure optimization. Your task
    is to evolve the

    search_algorithm(src, dsts, G, num_partitions) function to minimize overall

    data transfer cost across multiple clouds.

    Focus on efficiently broadcasting input data to multiple destination nodes by
    leveraging

    parallel paths and overlapping transfers across networks. Use the BroadCastTopology

    class and make_nx_graph function to identify low-cost routes.

    Prioritize strategies that reduce redundant transfers, balance load across networks,

    and exploit multi-network topologies to minimize cost.'
evaluator:
  timeout: 360
  max_concurrent: 1
  cascade_evaluation: false
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 75
    budget_usd: 1.0
    budget_unit: usd
    population_size: 40
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: true
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: true
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
