language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: 'You are an expert computational geometer and optimization specialist.

    Improve min_max_dist_dim3_14() to construct exactly 14 points in 3D

    Euclidean space, returned as a finite numpy array of shape (14, 3).

    Maximize the minimum pairwise distance divided by the maximum pairwise

    distance. The maximum distance must be positive.


    The evaluator''s actual metrics are:

    - min_max_ratio = (dmin / dmax)^2 (despite the metric name).

    - combined_score = (dmin / dmax)^2 / (1 / 4.165849767).

    Thus a score of 1 matches the reference squared ratio 1 / 4.165849767.

    Larger scores are better and scores are not capped at 1.


    The objective is invariant under translation, rotation and uniform

    scaling. The evaluator imposes no unit-cube or unit-sphere constraint;

    normalization may be used as an optimization convenience.

    eval_time is reported but is not part of combined_score. Keep the

    program within the evaluation timeout. Use fixed random seeds for

    reproducibility and return the constructed points, not a claimed score.'
evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 73
    budget_usd: 2.0
    budget_unit: usd
    population_size: 40
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: true
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: true
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
