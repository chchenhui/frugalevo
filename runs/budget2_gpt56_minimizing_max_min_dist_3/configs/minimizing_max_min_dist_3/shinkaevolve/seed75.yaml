language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: 'You are an expert computational geometer and optimization specialist.

    Improve min_max_dist_dim3_14() to construct exactly 14 points in 3D

    Euclidean space, returned as a finite numpy array of shape (14, 3).

    Maximize the minimum pairwise distance divided by the maximum pairwise

    distance. The maximum distance must be positive.


    The evaluator''s actual metrics are:

    - min_max_ratio = (dmin / dmax)^2 (despite the metric name).

    - combined_score = (dmin / dmax)^2 / (1 / 4.165849767).

    Thus a score of 1 matches the reference squared ratio 1 / 4.165849767.

    Larger scores are better and scores are not capped at 1.


    The objective is invariant under translation, rotation and uniform

    scaling. The evaluator imposes no unit-cube or unit-sphere constraint;

    normalization may be used as an optimization convenience.

    eval_time is reported but is not part of combined_score. Keep the

    program within the evaluation timeout. Use fixed random seeds for

    reproducibility and return the constructed points, not a claimed score.'
evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: shinkaevolve
  num_context_programs: 4
  database:
    random_seed: 75
    budget_usd: 2.0
    budget_unit: usd
