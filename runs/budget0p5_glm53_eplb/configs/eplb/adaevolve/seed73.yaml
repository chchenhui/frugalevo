language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  max_tokens: 32000
  timeout: 600
  reasoning_effort: low
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms.\
    \ Your task\nis to improve the Mixture-of-Expert models Expert Parallelism Load\
    \ Balancer\n(MoE EPLB) expert rearrangement algorithm.\n\nThis algorithm will\
    \ take the load metrics recorded by the vLLM server, and\nrearrange the experts\
    \ to balance the load. It can make replicas of some experts\nto achieve better\
    \ load balancing.\n\nYour goal will be two-fold:\n1. Improve the algorithm to\
    \ achieve better load balancing; while\n2. Improve the algorithm to be more efficient,\
    \ i.e. reduce the execution time\n   of the algorithm itself, since perfect load\
    \ balancing is NP-hard.\n\nThe current algorithm is implemented in the `rebalance_experts`\
    \ function."
evaluator:
  timeout: 4350.0
  max_retries: 0
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: adaevolve
  num_context_programs: 4
  database:
    random_seed: 73
    budget_usd: 2.0
    budget_unit: usd
    population_size: 20
    num_islands: 2
