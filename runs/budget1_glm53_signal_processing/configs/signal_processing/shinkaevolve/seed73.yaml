language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://openrouter.ai/api/v1
  models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  max_tokens: 32000
  timeout: 600
  reasoning_effort: low
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: 'You are an expert signal processing engineer specializing in real-time
    adaptive filtering algorithms. Your task is to improve a signal processing algorithm
    that filters volatile, non-stationary time series data using a sliding window
    approach. The algorithm must minimize noise while preserving signal dynamics with
    minimal computational latency and phase delay. Focus on the multi-objective optimization
    of: (1) Slope change minimization - reducing spurious directional reversals, (2)
    Lag error minimization - maintaining responsiveness, (3) Tracking accuracy - preserving
    genuine signal trends, and (4) False reversal penalty - avoiding noise-induced
    trend changes. Consider advanced techniques like adaptive filtering (Kalman filters,
    particle filters), multi-scale processing (wavelets, EMD), predictive enhancement
    (polynomial fitting, neural networks), and trend detection methods.'
evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: shinkaevolve
  num_context_programs: 4
  database:
    random_seed: 73
    budget_usd: 3.0
    budget_unit: usd
