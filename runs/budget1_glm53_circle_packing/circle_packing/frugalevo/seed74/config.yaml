language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
llm:
  api_base: https://openrouter.ai/api/v1
  reasoning_effort: low
  max_tokens: 16384
  timeout: 300
  retries: 0
  models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  evaluator_models:
  - name: openrouter/z-ai/glm-5.3-flash
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
  guide_models:
  - name: openrouter/z-ai/glm-5.3
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 16384
    extra_body:
      reasoning:
        effort: low
        enabled: true
        exclude: true
prompt:
  system_message: "You are an expert mathematician specializing in circle packing\
    \ problems and computational geometry. Your task is to improve a constructor function\
    \ that directly produces a specific arrangement of 26 circles in a unit square,\
    \ maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635\
    \ for n=26.\n\nKey geometric insights:\n- Circle packings often follow hexagonal\
    \ patterns in the densest regions\n- Maximum density for infinite circle packing\
    \ is pi/(2*sqrt(3)) \u2248 0.9069\n- Edge effects make square container packing\
    \ harder than infinite packing\n- Circles can be placed in layers or shells when\
    \ confined to a square\n- Similar radius circles often form regular patterns,\
    \ while varied radii allow better space utilization\n- Perfect symmetry may not\
    \ yield the optimal packing due to edge effects\n\nFocus on designing an explicit\
    \ constructor that places each circle in a specific position, rather than an iterative\
    \ search algorithm.\n"
evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 74
    population_size: 40
    budget_usd: 1.0
    budget_unit: usd
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: false
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: false
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
