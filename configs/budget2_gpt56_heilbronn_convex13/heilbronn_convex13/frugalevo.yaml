language: python
diff_based_generation: true
max_iterations: 200
checkpoint_interval: 5
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  max_tokens: 8192
  timeout: 600
  retries: 0
  models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  evaluator_models:
  - name: gpt-5.6-luna
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
  guide_models:
  - name: gpt-5.6-terra
    weight: 1.0
    reasoning_effort: low
    retries: 0
    max_tokens: 8192
prompt:
  system_message: "SETTING:\nYou are an expert computational geometer and optimization\
    \ specialist with deep expertise in the Heilbronn triangle problem - a fundamental\
    \ challenge in discrete geometry first posed by Hans Heilbronn in 1957.\nThis\
    \ problem asks for the optimal placement of n points within a convex region of\
    \ unit area to maximize the area of the smallest triangle formed by any three\
    \ of these points. \nYour expertise spans classical geometric optimization, modern\
    \ computational methods, and the intricate mathematical properties that govern\
    \ point configurations in constrained spaces.\n\nPROBLEM SPECIFICATION:\nDesign\
    \ and implement a constructor function that generates an optimal arrangement of\
    \ exactly 13 points within or on the boundary of a unit-area convex region. The\
    \ solution must:\n- Place all 13 points within or on a convex boundary\n- Maximize\
    \ the minimum triangle area among all C(13,3) = 286 possible triangles\n- Return\
    \ deterministic, reproducible results\n- Execute efficiently within computational\
    \ constraints\n\nPERFORMANCE METRICS:\n1. **min_area_normalized**: (Area of smallest\
    \ triangle) / (Area of convex hull) [PRIMARY - MAXIMIZE]\n2. **combined_score**:\
    \ min_area_normalized / 0.030936889034895654 [BENCHMARK COMPARISON - TARGET >\
    \ 1.0]\n3. **eval_time**: Execution time in seconds [EFFICIENCY - secondary priority]\n\
    \nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use fixed random seeds if employing\
    \ stochastic methods for reproducibility\n- **Error handling**: Graceful handling\
    \ of optimization failures or infeasible configurations\n\nMATHEMATICAL CONTEXT\
    \ & THEORETICAL BACKGROUND:\n- **PROBLEM COMPLEXITY**: The Heilbronn problem is\
    \ among the most challenging in discrete geometry, with optimal configurations\
    \ rigorously known only for n \u2264 4 points\n- **ASYMPTOTIC BEHAVIOR**: For\
    \ large n, the optimal value approaches O(1/n\xB2) with logarithmic corrections,\
    \ but the exact constant remains unknown\n- **GEOMETRIC CONSTRAINTS**: Points\
    \ must balance competing objectives:\n  * Interior points can form larger triangles\
    \ but create crowding\n  * Boundary points avoid area penalties but limit triangle\
    \ formation\n  * Edge cases arise when three points become nearly collinear\n\
    - **SYMMETRY CONSIDERATIONS**: Optimal configurations often exhibit rotational\
    \ symmetries (particularly 3-fold due to triangular geometry)\n- **SCALING INVARIANCE**:\
    \ The problem is scale-invariant; solutions can be normalized to any convex region\n\
    - **CRITICAL GEOMETRIC PROPERTIES**:\n  * Delaunay triangulation properties and\
    \ angle optimization\n  * Voronoi diagram regularity as indicator of point distribution\
    \ quality\n  * Relationship between circumradius and triangle area\n  * Connection\
    \ to sphere packing and energy minimization principles\n\nADVANCED OPTIMIZATION\
    \ STRATEGIES:\n- **MULTI-SCALE APPROACH**: Coarse global search \u2192 fine local\
    \ refinement with adaptive step sizes\n- **CONSTRAINT HANDLING**: Penalty methods,\
    \ barrier functions, or projection operators for convexity\n- **INITIALIZATION\
    \ STRATEGIES**:\n  * Perturbed regular grids (triangular, square, hexagonal lattices)\n\
    \  * Random points with force-based relaxation\n  * Symmetry-constrained configurations\
    \ (3-fold, 6-fold rotational)\n  * Hybrid boundary/interior distributions\n  *\
    \ Low-discrepancy sequences (Sobol, Halton) for uniform coverage\n- **OBJECTIVE\
    \ FUNCTION DESIGN**:\n  * Smooth approximations to min() function (LogSumExp,\
    \ p-norms with p\u2192\u221E)\n  * Barrier methods for boundary constraints\n\
    \  * Multi-objective formulations balancing multiple triangle areas\n  * Weighted\
    \ combinations of smallest k triangle areas\n- **ADVANCED TECHNIQUES**:\n  * Riemannian\
    \ optimization on manifolds\n  * Variational methods treating point density as\
    \ continuous field\n  * Machine learning-guided search using learned geometric\
    \ priors\n  * Topological optimization considering point connectivity graphs\n\
    \  * Continuation methods with parameter homotopy\n\nGEOMETRIC INSIGHTS & HEURISTICS:\n\
    - **BOUNDARY CONSIDERATIONS**: Points on boundary contribute to convex hull but\
    \ may form smaller triangles\n- **TRIANGLE DEGENERACY**: Avoid near-collinear\
    \ configurations that create arbitrarily small triangles\n- **LOCAL VS GLOBAL**:\
    \ Balance between locally optimal triangle sizes and global configuration harmony\n\
    - **SYMMETRY EXPLOITATION**: 3-fold rotational symmetry often appears in optimal\
    \ configurations\n- **VORONOI RELATIONSHIPS**: Points should have roughly equal\
    \ Voronoi cell areas for optimal distribution\n- **ENERGY ANALOGIES**: Treat as\
    \ electrostatic repulsion or gravitational equilibrium problem\n- **HISTORICAL\
    \ APPROACHES**:\n  * Regular lattice arrangements (suboptimal but provide baselines)\n\
    \  * Hexagonal close-packing adaptations\n  * Force-based relaxation (treating\
    \ points as mutually repelling particles)\n  * Simulated annealing and evolutionary\
    \ computation\n  * Gradient descent with carefully designed objective functions\n\
    \nVALIDATION FRAMEWORK:\n- **Geometric constraint verification**:\n  * Point count\
    \ validation: Exactly 13 points required\n  * Convexity check: All points within\
    \ or on boundary of convex hull\n- **Data integrity checks**:\n  * Coordinate\
    \ bounds: All coordinates are finite real numbers\n  * Point uniqueness: No duplicate\
    \ points (within numerical tolerance)\n  * Geometric consistency: Points form\
    \ valid geometric configuration\n- **Solution quality assessment**:\n  * Local\
    \ optimality testing through small perturbations\n  * Symmetry analysis: Detection\
    \ of rotational/reflectional symmetries\n  * Distribution quality: Voronoi cell\
    \ area variance, nearest neighbor statistics\n  * Convergence verification: For\
    \ iterative methods, check convergence criteria\n- **Determinism verification**:\n\
    \  * Multiple execution consistency: Same results across multiple runs\n  * Seed\
    \ effectiveness: Proper random seed implementation\n  * Platform independence:\
    \ Results stable across different computing environments\n"
evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false
max_parallel_iterations: 1
human_feedback_enabled: false
log_level: INFO
monitor:
  enabled: false
search:
  type: frugalevo
  num_context_programs: 4
  database:
    random_seed: 73
    budget_usd: 2.0
    budget_unit: usd
    population_size: 40
    target_score: null
    stop_on_target: false
    two_tier: true
    auto_generate_strategy_guidance: true
    lazy_strategy_guidance: true
    opening_cascade: true
    opening_cheap_candidates: 3
    opening_independent_sampling: true
    opening_direct_guide_hedge: false
    opening_post_guide_cheap_probe: false
    opening_guide_reasoning_effort: low
    opening_failure_retries: 0
    strategy_when: stalled
    implementations_per_strategy: 3
    strategies_per_guide_call: 3
    initial_strategies_per_guide_call: 3
    strategy_reference_candidate: true
    ordered_strategy_racing: true
    ordered_pilot_pruning: false
    ordered_pilot_prune_nonpositive: true
    adaptive_implementation_racing: false
    stop_racing_on_improvement: false
    adaptive_pilot_sizing: false
    pilot_candidates: 1
    improvement_epsilon: 1.0e-07
    search_incumbent_enabled: false
    search_incumbent_elite_ratio: 0.35
    search_incumbent_stagnation_patience: 2
    search_incumbent_cooldown: 2
    sequential_implementation_feedback: true
    sequential_parallel_after_valid_miss: false
