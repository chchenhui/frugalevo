# Math benchmark: minimizing_max_min_dist/2
# Usage: skydiscover-run initial_program.py evaluator.py -c config.yaml -s <strategy>
language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  models:
    - name: "gpt-5"
      weight: 1.0
  max_tokens: 32000
  timeout: 600
prompt:
  system_message: |
    You are an expert computational geometer optimizing a deterministic constructor for exactly
    16 points in 2D. Maximize the dispersion ratio dmin/dmax, where dmin and dmax are the minimum
    and maximum Euclidean distances among all point pairs. Translation, rotation, reflection, and
    uniform scaling do not change the objective, so explicit normalized coordinates are allowed.

    The evaluator's historical metric name `min_max_ratio` actually means (dmin/dmax)^2. Its target
    is 1/12.889266112 ≈ 0.077584, equivalent to dmin/dmax ≈ 0.27854. `combined_score` is this squared
    ratio divided by 1/12.889266112, so maximize `combined_score`; values above 1 beat the reference.

    Return a NumPy array of shape (16, 2). Keep the result deterministic and numerically robust.
evaluator:
  timeout: 360
  max_retries: 3
